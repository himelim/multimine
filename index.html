<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#15171c" />
  <title>멀티 지뢰찾기</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app">
    <section id="page-home" class="page active">
      <div class="card home-card">
        <div class="logo">💣</div>
        <h1>멀티 지뢰찾기</h1>
        <p class="sub">친구와 같은 지뢰밭을 함께 탐험하세요!</p>
        <label>닉네임</label>
        <input id="nickname" maxlength="12" placeholder="닉네임 입력" autocomplete="off" />
        <label>방 코드</label>
        <input id="room-code" maxlength="6" placeholder="참여할 때만 입력" autocomplete="off" autocapitalize="characters" />
        <div class="home-buttons">
          <button id="create-room" class="primary">새 방 만들기</button>
          <button id="join-room" class="secondary">방 참여하기</button>
        </div>
        <p id="home-status" class="status"></p>
        <details>
          <summary>처음이라면</summary>
          <p>한 명이 새 방을 만들고 표시되는 6자리 코드를 친구에게 알려주세요. 친구는 같은 코드로 들어오면 됩니다.</p>
        </details>
      </div>
    </section>

    <section id="page-game" class="page">
      <header class="game-header">
        <div>
          <div class="small-title">MULTI MINESWEEPER</div>
          <div class="room-line">방 코드 <strong id="room-code-display">------</strong> <button id="copy-code" class="tiny">복사</button></div>
        </div>
        <div class="stats">
          <span>💣 <b id="mine-count">150</b></span>
          <span>🚩 <b id="flag-count">0</b></span>
        </div>
      </header>
      <div id="players" class="players"></div>
      <div id="game-status" class="game-status">게임 진행 중</div>
      <div id="board-wrap" class="board-wrap"><div id="board" class="board" aria-label="지뢰찾기 게임판"></div></div>
      <p class="hint">칸을 누르면 행동을 선택할 수 있어요.</p>
      <button id="leave-room" class="leave">방 나가기</button>
    </section>
  </main>

  <div id="action-modal" class="modal hidden">
    <div class="modal-card action-card">
      <h2 id="action-title">무엇을 할까요?</h2>
      <div class="action-buttons">
        <button id="dig-btn" class="primary">⛏️ 땅 파기</button>
        <button id="flag-btn" class="flag-action">🚩 깃발 세우기</button>
        <button id="cancel-btn" class="secondary">취소</button>
      </div>
    </div>
  </div>

  <div id="result-modal" class="modal hidden">
    <div class="modal-card result-card">
      <div id="result-emoji" class="result-emoji">🎉</div>
      <h2 id="result-title">성공!</h2>
      <p id="result-text"></p>
      <div class="result-buttons">
        <button id="again-btn" class="primary">다시 한 번</button>
        <button id="result-leave-btn" class="secondary">방 나가기</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
